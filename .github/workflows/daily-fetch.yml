name: Daily German News Fetch

on:
  schedule:
    # 每天 UTC 07:00 = 北京时间 15:00 / 德国 08:00（冬令时）。
    # GitHub 的定时任务可能延迟几分钟到几十分钟，属正常现象。
    - cron: "0 7 * * *"
  workflow_dispatch:            # Actions 页面上的 “Run workflow” 手动按钮
    inputs:
      force:
        description: "今天已有数据时也强制重新抓取并覆盖"
        type: boolean
        default: false
      source:
        description: "优先使用的来源（失败时仍会自动降级到其他来源）"
        type: choice
        default: auto
        options:
          - auto
          - ndr_leicht
          - mdr_leicht
          - nachrichtenleicht
          - tagesschau_einfach
          - dw_langsam
  push:                         # 你修改前端代码并推送时，只重新部署网页，不抓新闻
    branches: [main]
    paths-ignore:
      - "data/news.json"

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  # ---------------- 1. 抓取新闻 + 生成精读数据 + 提交回仓库 ----------------
  fetch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write           # 允许把 data/news.json 提交回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch news & generate analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 可在 Settings → Secrets and variables → Actions → Variables 中设置覆盖
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SOURCE_STRATEGY: ${{ vars.SOURCE_STRATEGY || 'priority' }}
          SITE_TZ: Asia/Shanghai
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
          SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'auto' }}
        run: python scripts/fetch_news.py

      - name: Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "没有新数据，无需提交。"
            exit 0
          fi
          git commit -m "chore(data): daily news $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # ---------------- 2. 部署到 GitHub Pages ----------------
  # 直接在工作流里部署，保证“新数据提交后网站一定同步更新”
  deploy:
    needs: fetch
    if: ${{ !cancelled() && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest (含刚提交的数据)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Wait for Pages artifact
        shell: bash
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ ! "$UPLOADED_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Pages upload did not return an artifact ID."
            exit 1
          fi

          for attempt in {1..12}; do
            if visible_id=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id') &&
              [[ "$visible_id" == "$UPLOADED_ARTIFACT_ID" ]]; then
              echo "Pages artifact $UPLOADED_ARTIFACT_ID is visible."
              exit 0
            fi
            if (( attempt < 12 )); then
              echo "Waiting for Pages artifact $UPLOADED_ARTIFACT_ID ($attempt/12)."
              sleep 5
            fi
          done

          echo "::error::Pages artifact $UPLOADED_ARTIFACT_ID did not become visible in this run."
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
